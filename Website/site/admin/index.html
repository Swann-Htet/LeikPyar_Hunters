<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0705">
  <title>Admin - Leikpyar Hunters</title>
  <link rel="icon" href="/favicon.ico?v=3" sizes="any">
  <link rel="icon" href="/img/favicon-32.png?v=3" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="/admin/admin.css?v=1">
</head>
<body>
  <div id="boot" class="boot">Loading</div>

  <!-- sign in -->
  <main id="login" class="login" hidden>
    <form id="loginForm" class="login-card" novalidate>
      <img src="/img/logo-symbol.png?v=3" alt="" width="56" height="56" draggable="false">
      <h1>Leikpyar Hunters</h1>
      <p class="muted">Admin panel</p>
      <label class="field"><span>E-mail</span><input id="lEmail" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="field"><span>Password</span><input id="lPass" type="password" autocomplete="current-password" required></label>
      <p class="msg" id="lMsg" role="alert"></p>
      <button class="btn primary block" id="lGo" type="submit">Sign in</button>
    </form>
  </main>

  <!-- the panel -->
  <div id="app" class="app" hidden>
    <aside class="side" id="side">
      <a class="brand" href="#/dashboard"><img src="/img/logo-symbol.png?v=3" alt="" width="34" height="34" draggable="false"><span>Leikpyar <b>Hunters</b><small>Admin</small></span></a>
      <nav id="nav" aria-label="Admin"></nav>
      <div class="side-foot">
        <a class="side-link" href="/" target="_blank" rel="noopener" id="viewSite"></a>
      </div>
    </aside>
    <div class="main">
      <header class="bar">
        <button class="icon-btn menu" id="menuBtn" type="button" aria-label="Menu"></button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="bar-right">
          <span class="who" id="who"></span>
          <button class="btn ghost sm" id="logout" type="button"></button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tip" class="tip" hidden></div>

  <script src="/admin/admin.js?v=1"></script>
</body>
</html>
